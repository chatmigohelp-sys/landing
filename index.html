<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat With Me</title>

  <style>
    /* ============================================================
     ⚙️  EASY SETTINGS — change these three things any time
     ============================================================ */
    :root {
      /* 1) Profile picture — paste any image URL between the quotes */
      --profile-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFV6-0NOgVA0XDAoAuG1SNrtT77z6Ho4TLY64CvuVwig&s=10");
    }

    /* 2) Telegram link is set on the <a id="tg-btn"> tag near the bottom of this file.
     3) Name / tagline / description text is in the <body> section below. */

    /* ============================================================ */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 30% 20%, #d61fa8 0%, #9d217e 45%, #c0238e 100%);
      color: #f3eef7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgb(241, 244, 246);
      backdrop-filter: blur(6px);
      border-radius: 28px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .avatar-ring {
      width: 132px;
      height: 132px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 4px;
      background: conic-gradient(from 180deg, #caa8ff, #7fd9d0, #caa8ff);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-image: var(--profile-image);
      background-size: cover;
      background-position: center;
      border: 3px solid #1c1428;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: #a7f3c4;
      background: rgba(51, 248, 123, 0.1);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .status span.dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 6px;
      color: #ffffff;
    }

    .tagline {
      font-size: 14.5px;
      color: #ffffff;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .desc {
      font-size: 13.5px;
      color: #ffffff;
      line-height: 1.6;
      margin: 0 0 22px;
    }

    .menu {
      list-style: none;
      margin: 0 0 26px;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
    }

    .menu li {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13.5px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 254, 254, 0.829);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .menu li svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      color: #ffffff;
      ;
    }

    .tg-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 18px;
      background: #29a9eb;
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      box-shadow: 0 10px 24px rgba(41, 169, 235, 0.35);
    }

    .tg-btn:hover {
      background: #1c98d8;
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(41, 169, 235, 0.45);
    }

    .tg-btn:active {
      transform: translateY(0);
    }

    .tg-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .footnote {
      margin-top: 16px;
      font-size: 11.5px;
      color: #b1adb6;
    }

    @media (max-width: 380px) {
      .card {
        padding: 32px 20px 26px;
      }

      .avatar-ring {
        width: 112px;
        height: 112px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="avatar-ring">
      <div class="avatar"></div>
    </div>

    <div class="status"><span class="dot"></span>Online now</div>

    <!-- ✏️ Change name here -->
    <h1>Pihu Sharma</h1>

    <!-- ✏️ Change tagline here -->
    <p class="tagline"><b>FREE 1 DEMO PIC</b> <br>All Genuine Services - DM NOW 💖</p>

    <!-- ✏️ Change description here -->
    <p class="desc"></p>

    <!-- ✏️ Edit the menu items / labels here -->
    <ul class="menu">
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path
            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
        </svg>
        Chatting 😉
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M23 7l-7 5 7 5V7z" />
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
        </svg>
        Video Calls 💦
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="M21 15l-5-5L5 21" />
        </svg>
        Pics 🔥
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7" />
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
        </svg>
        Videos❤️
      </li>
    </ul>

    <!-- ✏️ CHANGE THE TELEGRAM LINK HERE (href) -->
    <a id="tg-btn" class="tg-btn" href="https://t.me/pihuusharma" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M9.036 15.803l-.373 5.259c.534 0 .765-.23 1.045-.505l2.507-2.395 5.196 3.804c.953.525 1.63.249 1.888-.881L22.94 3.5c.322-1.394-.503-1.94-1.43-1.6L1.114 9.607c-1.36.53-1.343 1.288-.232 1.632l5.09 1.587L18.2 5.14c.554-.36 1.058-.16.643.2z" />
      </svg>
      Message on Telegram
    </a>

    <p class="footnote">Response time: usually within a few minutes</p>

  </div>

</body>

</html>
